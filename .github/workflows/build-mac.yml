name: Build macOS Application

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build desktop and package macOS ZIP
        run: npm run build:mac --workspace=desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lupin-Music-macOS
          path: |
            desktop/release/*.zip

      # main dalindaki her yesil derlemede mac zip'leri v1.0.0 release'ine
      # eklenir (yerel mac derlemesi yapilmaz; tek kaynak CI'dir).
      - name: Attach macOS ZIPs to v1.0.0 release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in desktop/release/*.zip; do
            gh release upload v1.0.0 "$f" --clobber
          done
